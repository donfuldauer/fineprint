[package]
name = "fineprint-core"
description = "Deterministic rules engine core of Fine Print (rules crate)."
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fineprint-base.workspace = true
fineprint-dsl.workspace = true
serde = { workspace = true }
rmp-serde = { workspace = true }

[features]
# Full-recompute debug mode of the layer cache (REQ-LAYER-005): the cache stores nothing and
# every evaluation is computed afresh. Not a default; CI's `differential` job enables it.
full-recompute = []

[dev-dependencies]
# Benchmark harness (REQ-NFR-009); exact pin, no plotters or rayon (docs/DECISIONS.md
# "#36 FP-035 — criterion pin").
criterion = { version = "=0.8.2", default-features = false }
serde_json = { workspace = true }

[[bench]]
name = "layers_recompute"
harness = false
