# CodeRabbit is the only code reviewer in the run (docs/PROCESS.md P6, rule R9).
#
# Review rhythm: GATE REVIEWS ONLY. CodeRabbit does not review routine unit-of-work PRs; they merge
# on green CI, coverage floors, repository guards, differential layer checks and `work-verifier`
# (P5 unit gate). CodeRabbit reviews only at the completion of a phase or milestone, on a
# review-only "gate review" PR whose head is the gate issue's branch and whose base is
# `review-base/<gate>` (the last reviewed commit, tag `reviewed/<previous gate>`), so the review
# covers every change merged since the previous gate (docs/PROCESS.md P6 "Gate reviews").
# The Orchestrator requests each pass explicitly with `@coderabbitai full review` (first pass) and
# `@coderabbitai review` (after fix pushes); nothing is reviewed automatically.
language: en-US
reviews:
  # Gate reviews are infrequent and cumulative, so report everything worth fixing.
  profile: chill
  # Approve once every comment is resolved (PROCESS.md P6 gate merge conditions).
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    # Off: routine PRs are never reviewed; gate review PRs are reviewed on explicit request.
    enabled: false
    drafts: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    # Gate review PRs target `review-base/<gate>` branches, not `main`.
    base_branches:
      - "^review-base/.*"
  # Keep generated, binary and recorded data out of review. Source, DSL schemas, card
  # definitions, .pzl scenarios, CI and docs stay in review.
  path_filters:
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.wasm"
    - "!**/*.fpdb"
    - "!**/*.fpreplay"
    - "!**/*.msgpack"
    - "!**/Cargo.lock"
    - "!**/packages.lock.json"
    - "!**/package-lock.json"
    - "!**/proptest-regressions/**"
    - "!**/target/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/ingest-cache/**"
    - "!**/coverage-report*.json"
    - "!dist/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        This is a cumulative phase or milestone gate review: the diff is every change merged since
        the previous gate. Look across files and modules for what per-unit work misses:
        architectural drift, duplicated logic, mismatched contracts, awkward state transitions and
        test gaps. Prioritise issues that are expensive to change later or block correctness:
        architectural boundaries, P3 public interfaces/schemas/wire/binding contracts,
        deterministic rules loops and state machines, R3 determinism, R4 no card-specific
        branches, R5 card-data boundary, R11 VERIFIED enforcement, R12 untrusted-input parsing and
        hidden-information redaction, and verified correctness defects. Skip cosmetic style and
        formatting (rustfmt, clippy, coverage floors, guards and unit/spec tests cover them).
        Mention any repeated pattern once at summary level instead of posting duplicate inline
        comments.
    - path: "**/*.{rs,cs,c,h,cpp,ts}"
      instructions: >-
        Check docs/PROCESS.md rules. R3: no floating point in rules paths, no iteration over
        hash-ordered containers where order can affect results, no clock/I/O/global state, all
        randomness from the state's PRNG. R4: no branch on a cardDefId or card name in engine
        code. R5: no card names or Oracle text in engine source. R6: rules procedures cite the
        CR rule they implement. Every source file starts with the MPL-2.0 Exhibit A header
        (REQ-NFR-012). Flag any path where a redacted player view or determinized fork
        could expose hidden information (REQ-CORE-004, REQ-API-004).
    - path: "**/*.pzl"
      instructions: >-
        Scenario tests (REQ-TEST-001). Header must list REQ IDs, CR rules, card definition hashes
        and a fixed PRNG seed. Flag missing orderings (both timestamp orders, APNAP), assertions on
        wall-clock or non-canonical bookkeeping, and weakened or removed assertions.
    - path: "**/tests/**"
      instructions: >-
        Tests must not sleep or assert on wall-clock time, and must name the REQ IDs they cover.
        Flag skipped, ignored or weakened assertions.
    - path: "docs/**"
      instructions: >-
        Planning, process, and decision records. Flag only substantive contradictions with
        docs/SRS.md requirement IDs or docs/PROCESS.md, broken commands/links, wrong CR rule
        numbers against the SRS rules baseline, or schema/format violations (e.g. docs/DECISIONS.md
        and docs/HUMAN_QUEUE.md contracts). Skip prose phrasing nits.
chat:
  auto_reply: true
