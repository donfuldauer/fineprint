# CodeRabbit is the only code reviewer in the run (docs/PROCESS.md P6, rule R9).
#
# Review phase: INITIAL USABLE BUILD (Milestone M1 — Two-player engine).
# While M1 assembles the first usable end-to-end two-player build, per-PR auto-review is opt-in by
# PR label:
#   - `review:skip` (or no opt-in label): skipped during M1 vertical slices (tests, coverage
#     floors, repo guards, differential layer checks, work-verifier and CI still gate every merge).
#   - `review:sanity`: targeted single-pass sanity review on P3 contracts, public APIs/schemas,
#     bindings, core deterministic state-machine/rules loops, very-high blast radius, R5/R11/R12
#     security and compliance boundaries, and milestone determinism/conformance/release gates.
#   - `review:full`: full review (M1 cohesive review pass #219 / FP-161, M1 acceptance #123 /
#     FP-121, or explicit opt-in).
# When #219 (FP-161) merges once M1 works end-to-end, flip `profile` to `chill`,
# `auto_review.enabled` to `true`, and `auto_review.labels` to `["!review:skip"]` for tighter
# post-usable per-chunk reviews.
language: en-US
reviews:
  # Critical and major findings inline; minor/nitpicks collapsed in the summary during M1.
  profile: quiet
  # Approve once every comment is resolved on reviewed PRs (PROCESS.md P6 step 5).
  request_changes_workflow: true
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    # Opt-in by positive label during M1; flip to `true` with `["!review:skip"]` in #219 (FP-161).
    enabled: false
    drafts: false
    auto_incremental_review: true
    # Pause after 2 reviewed commits so fix rounds are batched locally instead of looping; use
    # `@coderabbitai review` explicitly when another pass is needed.
    auto_pause_after_reviewed_commits: 2
    labels:
      - "review:sanity"
      - "review:full"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    base_branches:
      - main
  # Keep generated, binary and recorded data out of review. Source, DSL schemas, card
  # definitions, .pzl scenarios, CI and docs stay in review.
  path_filters:
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    - "!**/*.wasm"
    - "!**/*.fpdb"
    - "!**/*.fpreplay"
    - "!**/*.msgpack"
    - "!**/Cargo.lock"
    - "!**/packages.lock.json"
    - "!**/package-lock.json"
    - "!**/proptest-regressions/**"
    - "!**/target/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/ingest-cache/**"
    - "!**/coverage-report*.json"
    - "!dist/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Focus on issues that are expensive to change later or block correctness: architectural
        boundaries, P3 public interfaces/schemas/wire/binding contracts, deterministic rules loops
        and state machines, R3 determinism, R4 no card-specific branches, R5 card-data boundary,
        R11 VERIFIED enforcement, R12 untrusted-input parsing and hidden-information redaction,
        and verified correctness defects. Ignore cosmetic style, formatting, and minor
        naming/refactor nitpicks (rustfmt, clippy, coverage floors, guards, and unit/spec tests
        cover them; broader refactors belong in the M1 cohesive review pass #219). Mention any
        repeated pattern once at summary level instead of posting duplicate inline comments.
    - path: "**/*.{rs,cs,c,h,cpp,ts}"
      instructions: >-
        Check docs/PROCESS.md rules. R3: no floating point in rules paths, no iteration over
        hash-ordered containers where order can affect results, no clock/I/O/global state, all
        randomness from the state's PRNG. R4: no branch on a cardDefId or card name in engine
        code. R5: no card names or Oracle text in engine source. R6: rules procedures cite the
        CR rule they implement. Every source file starts with the MPL-2.0 Exhibit A header
        (REQ-NFR-012). Flag any path where a redacted player view or determinized fork
        could expose hidden information (REQ-CORE-004, REQ-API-004).
    - path: "**/*.pzl"
      instructions: >-
        Scenario tests (REQ-TEST-001). Header must list REQ IDs, CR rules, card definition hashes
        and a fixed PRNG seed. Flag missing orderings (both timestamp orders, APNAP), assertions on
        wall-clock or non-canonical bookkeeping, and weakened or removed assertions.
    - path: "**/tests/**"
      instructions: >-
        Tests must not sleep or assert on wall-clock time, and must name the REQ IDs they cover.
        Flag skipped, ignored or weakened assertions.
    - path: "docs/**"
      instructions: >-
        Planning, process, and decision records. Flag only substantive contradictions with
        docs/SRS.md requirement IDs or docs/PROCESS.md, broken commands/links, wrong CR rule
        numbers against the SRS rules baseline, or schema/format violations (e.g. docs/DECISIONS.md
        and docs/HUMAN_QUEUE.md contracts). Skip prose phrasing nits.
chat:
  auto_reply: true
