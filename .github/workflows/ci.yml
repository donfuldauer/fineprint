# Job names below are the required status checks on main (REQ-NFR-011).
# Do not rename them without updating branch protection; see docs/DEVELOPMENT.md "CI".
# Triggers: pull requests, and pushes to main only (a push to a PR branch already runs through
# its pull_request event; see docs/DECISIONS.md "CI — PR load"). On a pull request whose changes
# are documentation only (job `changes`), fmt, clippy and test still report success but skip
# their steps, and coverage is skipped; pushes to main always run everything.
# Jobs `differential` (cached versus full-recompute layer results, REQ-LAYER-005) and `bench`
# (layer recompute benchmark, REQ-NFR-009; not a required check) follow the same gating as test.
# Third-party actions: actions/checkout, actions/cache and actions/upload-artifact only, all
# first-party, pinned to exact version tags (checkout v4.2.2, cache v4.2.0, upload-artifact
# v4.6.2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether anything but documentation changed
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a rename lists both the old and the new path, so code moved to a .md still counts.
          files=$(git diff --no-renames --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # Documentation only: Markdown files and .claude/ (agent and skill text), which no build,
          # test or tool reads. docs/SRS.md is read by the xtask cr tests, so it counts as code.
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/SRS.md) code=true ;;
              *.md|.claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  fmt:
    name: fmt (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Formatting does not depend on the OS; test builds on all three (REQ-NFR-003).
        os: [ubuntu-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: cargo fmt
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Lints run once; test still builds every target on all three platforms (REQ-NFR-003).
        os: [ubuntu-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-clippy-
      - name: cargo clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-test-
      - name: cargo test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

  coverage:
    name: coverage (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-coverage-
      # cargo-llvm-cov 0.9.1: newest release at the time of writing; its minimum Rust is 1.87,
      # below the pinned 1.97.0. Bump deliberately (docs/DECISIONS.md FP-003).
      - name: Cache cargo-llvm-cov binary
        id: llvm-cov-cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-0.9.1
      - name: Add llvm-tools component
        run: rustup component add llvm-tools
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Measure line coverage
        run: >-
          cargo llvm-cov --workspace --locked --all-targets
          --no-default-ignore-filename-regex
          --ignore-filename-regex '(/\.cargo/(registry|git)/|/\.rustup/|/rustc/)'
          --json --summary-only --output-path target/llvm-cov-summary.json
      - name: Check per-crate floors
        run: cargo xtask coverage --input target/llvm-cov-summary.json

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Repository guards (headers, card data, card branches)
        run: cargo xtask guard all

  req-coverage:
    name: req-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Every SRS requirement is traced by a work-unit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/req_coverage.py

  differential:
    name: differential (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # REQ-LAYER-005: the whole suite also runs in full-recompute mode (the cached mode is the
    # test job), and the layer results of the differential scenarios must be byte-identical in
    # both modes. Linux only: the comparison is platform-independent. FINEPRINT_DIFF_DIR is
    # absolute because cargo runs a test binary in its package directory.
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-differential-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-differential-
      - name: cargo test (full-recompute mode)
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked --features fineprint-core/full-recompute
      - name: Scenario digests (cached mode)
        if: needs.changes.outputs.code == 'true'
        env:
          FINEPRINT_DIFF_DIR: ${{ github.workspace }}/target/differential/cached
        run: cargo test --locked -p fineprint-core --test spec_layers_cache_diff
      - name: Scenario digests (full-recompute mode)
        if: needs.changes.outputs.code == 'true'
        env:
          FINEPRINT_DIFF_DIR: ${{ github.workspace }}/target/differential/full
        run: cargo test --locked -p fineprint-core --features full-recompute --test spec_layers_cache_diff
      - name: Compare digests
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cached=target/differential/cached
          full=target/differential/full
          count=$(find "$cached" -maxdepth 1 -type f -name '*.digest' | wc -l)
          echo "cached-mode digest files: $count"
          if [ "$count" -lt 5 ]; then
            echo "error: expected at least 5 *.digest files in $cached, found $count"
            exit 1
          fi
          names_cached=$(cd "$cached" && ls -1 | sort)
          names_full=$(cd "$full" && ls -1 | sort)
          if [ "$names_cached" != "$names_full" ]; then
            echo "error: the two modes wrote different scenario files:"
            diff <(printf '%s\n' "$names_cached") <(printf '%s\n' "$names_full") || true
            exit 1
          fi
          if ! diff -r "$cached" "$full" > /dev/null; then
            echo "error: cached and full-recompute digests differ for:"
            for f in $names_cached; do
              cmp -s "$cached/$f" "$full/$f" || echo "  $f"
            done
            exit 1
          fi
          echo "all $count scenario digests are identical in both modes"

  bench:
    name: bench (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # REQ-NFR-009: the layer recompute benchmark runs on the reference runner and its results are
    # uploaded for trend tracking; slow numbers never fail this job (the phase gate compares).
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-bench-
      - name: cargo bench
        if: needs.changes.outputs.code == 'true'
        run: cargo bench --locked -p fineprint-core --bench layers_recompute -- --noplot
      - name: Summarise medians
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          python3 -I - target/criterion >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          print("| benchmark | median (ms) |")
          print("| --- | ---: |")
          for est in sorted(root.glob("**/new/estimates.json")):
              name = est.parent.parent.relative_to(root).as_posix()
              median_ns = json.loads(est.read_text())["median"]["point_estimate"]
              print(f"| {name} | {median_ns / 1e6:.3f} |")
          EOF
      - name: Upload criterion results
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: criterion-layers-recompute-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
          retention-days: 90
