# Job names below are the required status checks on main (REQ-NFR-011).
# Do not rename them without updating branch protection; see docs/DEVELOPMENT.md "CI".
# Triggers: pull requests, and pushes to main only (a push to a PR branch already runs through
# its pull_request event; see docs/DECISIONS.md "CI — PR load"). On a pull request whose changes
# are documentation only (job `changes`), fmt, clippy and test still report success but skip
# their steps, and coverage is skipped; pushes to main always run everything.
# Third-party actions: actions/checkout and actions/cache only, both first-party,
# pinned to exact version tags (checkout v4.2.2, cache v4.2.0).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether anything but documentation changed
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          # Documentation only: Markdown files and .claude/ (agent and skill text), which no build,
          # test or tool reads. docs/SRS.md is read by the xtask cr tests, so it counts as code.
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/SRS.md) code=true ;;
              *.md|.claude/*) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  fmt:
    name: fmt (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Formatting does not depend on the OS; test builds on all three (REQ-NFR-003).
        os: [ubuntu-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: cargo fmt
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Lints run once; test still builds every target on all three platforms (REQ-NFR-003).
        os: [ubuntu-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-clippy-
      - name: cargo clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep line endings as committed
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
        if: needs.changes.outputs.code == 'true'
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-test-
      - name: cargo test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --locked

  coverage:
    name: coverage (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Cache cargo registry and target
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-coverage-
      # cargo-llvm-cov 0.9.1: newest release at the time of writing; its minimum Rust is 1.87,
      # below the pinned 1.97.0. Bump deliberately (docs/DECISIONS.md FP-003).
      - name: Cache cargo-llvm-cov binary
        id: llvm-cov-cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-llvm-cov-0.9.1
      - name: Add llvm-tools component
        run: rustup component add llvm-tools
      - name: Install cargo-llvm-cov
        if: steps.llvm-cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Measure line coverage
        run: >-
          cargo llvm-cov --workspace --locked --all-targets
          --no-default-ignore-filename-regex
          --ignore-filename-regex '(/\.cargo/(registry|git)/|/\.rustup/|/rustc/)'
          --json --summary-only --output-path target/llvm-cov-summary.json
      - name: Check per-crate floors
        run: cargo xtask coverage --input target/llvm-cov-summary.json

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4.2.2
      - name: Install pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
      - name: Repository guards (headers, card data, card branches)
        run: cargo xtask guard all

  req-coverage:
    name: req-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Every SRS requirement is traced by a work-unit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/req_coverage.py
