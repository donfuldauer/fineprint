# cbindgen configuration for the FP-005 spike header (REQ-NFR-002).
# Regenerate from spikes/bindings with:
#   cbindgen --config cbindgen.toml --crate fineprint-spike-bindings --output include/fineprint_spike.h
# CI regenerates it and fails if it differs from the checked-in file.

language = "C"
include_guard = "FINEPRINT_SPIKE_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
header = """/* This Source Code Form is subject to the terms of the Mozilla Public License, v. 2.0.
 * If a copy of the MPL was not distributed with this file, You can obtain one at
 * https://mozilla.org/MPL/2.0/. */

/* Generated by cbindgen from spikes/bindings (FP-005 spike). Do not edit by hand. */"""

[fn]
args = "auto"
